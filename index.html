<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Compile Agent</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #111827;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --task: #3b82f6;
      --query: #f59e0b;
      --note: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.5rem; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; padding-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 600; color: #fff; letter-spacing: -0.02em; }

    .status-pill { display: flex; align-items: center; gap: 0.5rem; background: rgba(255, 255, 255, 0.03); padding: 0.35rem 0.85rem; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.06); font-size: 0.8rem; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #6b7280; }
    .status-dot.active { background-color: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Controls Card */
    .controls-card { background: var(--card-bg); padding: 1.25rem 1.5rem; border-radius: 12px; border: 1px solid #1f293d; display: flex; flex-direction: column; gap: 1rem; }
    .btn-group { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    
    button { padding: 0.65rem 1.1rem; border-radius: 8px; font-weight: 500; font-size: 0.875rem; cursor: pointer; border: none; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.5rem; }
    .btn-primary { background: var(--accent); color: #000; font-weight: 600; box-shadow: 0 0 12px var(--accent-glow); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: #1f293d; color: var(--text); border: 1px solid #374151; }
    .btn-secondary:hover { background: #374151; }
    .btn-demo { background: #7c3aed; color: white; }

    /* Clean Minimalist Visualizer Wrapper */
    .visualizer-container {
      height: 48px;
      background: #090d16;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .v-bar {
      width: 4px;
      height: 12px;
      background: #374151;
      border-radius: 4px;
      transition: height 0.1s ease, background-color 0.2s ease;
    }
    .v-bar.active {
      background: #38bdf8;
    }

    /* Main Grid Layout */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .panel { background: var(--card-bg); border-radius: 12px; border: 1px solid #1f293d; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.85rem; height: 380px; }
    .panel-title { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center; }

    .stream-box, .cards-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; padding-right: 0.25rem; }
    .stream-box::-webkit-scrollbar, .cards-box::-webkit-scrollbar { width: 4px; }
    .stream-box::-webkit-scrollbar-thumb, .cards-box::-webkit-scrollbar-thumb { background: #2a3447; border-radius: 4px; }
    
    .raw-text { font-family: monospace; font-size: 0.85rem; color: #d1d5db; line-height: 1.4; white-space: pre-wrap; }
    
    /* Categorized Cards */
    .card { background: #0a0f1d; padding: 0.75rem; border-radius: 8px; border-left: 3px solid var(--accent); animation: fadeIn 0.25s ease; border-top: 1px solid rgba(255,255,255,0.02); border-right: 1px solid rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.02); }
    .card.TASK { border-left-color: var(--task); }
    .card.QUERY { border-left-color: var(--query); }
    .card.NOTE { border-left-color: var(--note); }
    
    .card-header { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.2rem; display: flex; justify-content: space-between; opacity: 0.9; }
    .card.TASK .card-header { color: var(--task); }
    .card.QUERY .card-header { color: var(--query); }
    .card.NOTE .card-header { color: var(--note); }
    .card-body { font-size: 0.85rem; color: #f3f4f6; line-height: 1.4; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

    .metrics { font-size: 0.75rem; color: var(--muted); font-weight: normal; }
    .metric-value { color: #fff; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Audio Compile Agent</h1>
    <div class="status-pill">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Ready</span>
    </div>
  </header>

  <section class="controls-card">
    <div class="btn-group">
      <button id="toggleMicBtn" class="btn-primary" onclick="toggleListening()">
        🎤 Start Live Listening
      </button>
      <button id="demoBtn" class="btn-demo" onclick="toggleDemo()">
        ⚡ Run Pitch Demo
      </button>
      <button class="btn-secondary" onclick="exportReport()">
        💾 Export Clean Report
      </button>
      <button class="btn-secondary" onclick="clearAll()">
        🗑️ Clear
      </button>
    </div>
    <!-- Simple, elegant minimalist visualizer bar elements -->
    <div class="visualizer-container" id="visualizerBars">
      <!-- 24 clean bars generated via script -->
    </div>
  </section>

  <div class="grid">
    <!-- Unstructured Raw Stream -->
    <div class="panel">
      <div class="panel-title">Raw Audio Stream <span class="metrics">Words: <span id="wordCount" class="metric-value">0</span></span></div>
      <div class="stream-box" id="rawStream">
        <span class="raw-text" style="color: #4b5563;">Awaiting audio stream or demo execution...</span>
      </div>
    </div>

    <!-- Structured Action Cards -->
    <div class="panel">
      <div class="panel-title">Structured Intent Compiler <span class="metrics">Actions: <span id="actionCount" class="metric-value">0</span></span></div>
      <div class="cards-box" id="cardsBox">
        <!-- Cards insert dynamically -->
      </div>
    </div>
  </div>
</div>

<script>
  let isListening = false;
  let isRunningDemo = false;
  let recognition = null;
  let wordTotal = 0;
  let actionTotal = 0;
  let demoTimer = null;
  let animInterval = null;

  const synth = window.speechSynthesis;

  // Initialize minimalist visualizer bars
  const visContainer = document.getElementById('visualizerBars');
  const totalBars = 28;
  const barElements = [];
  for (let i = 0; i < totalBars; i++) {
    const bar = document.createElement('div');
    bar.className = 'v-bar';
    visContainer.appendChild(bar);
    barElements.push(bar);
  }

  // Setup Speech Recognition
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      isListening = true;
      updateUIState('active', 'Listening & Compiling...');
    };

    recognition.onresult = (event) => {
      const lastIndex = event.results.length - 1;
      const textPhrase = event.results[lastIndex][0].transcript.trim();
      if (textPhrase) processTranscriptChunk(textPhrase);
    };

    recognition.onerror = () => stopAllActivity();
    recognition.onend = () => {
      if (isListening && !isRunningDemo) {
        try { recognition.start(); } catch (e) {}
      }
    };
  }

  function toggleListening() {
    // CRITICAL: Instantly interrupt any ongoing demo audio if user clicks to listen
    interruptSpeechAndDemo();

    if (!recognition) return alert("Speech recognition unavailable. Use 'Run Pitch Demo'.");
    
    if (!isListening) {
      try {
        isListening = true;
        recognition.start();
        startMinimalVisualizer();
      } catch (err) {
        isListening = false;
      }
    } else {
      stopAllActivity();
    }
  }

  function toggleDemo() {
    if (isRunningDemo) {
      stopAllActivity();
    } else {
      runPresetDemo();
    }
  }

  function interruptSpeechAndDemo() {
    // Immediately cut off browser speech synthesis so judges can interrupt instantly
    if (synth) synth.cancel();
    if (demoTimer) clearTimeout(demoTimer);
    isRunningDemo = false;
  }

  function stopAllActivity() {
    interruptSpeechAndDemo();
    isListening = false;
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
    stopMinimalVisualizer();
    
    const btn = document.getElementById('toggleMicBtn');
    btn.innerText = "🎤 Start Live Listening";
    btn.style.background = "var(--accent)";
    btn.style.color = "#000";

    const demoBtn = document.getElementById('demoBtn');
    demoBtn.innerText = "⚡ Run Pitch Demo";
    demoBtn.style.background = "#7c3aed";
    demoBtn.style.color = "#white";

    document.getElementById('statusDot').classList.remove('active');
    document.getElementById('statusText').innerText = "Ready";
  }

  function updateUIState(stateType, message) {
    const btn = document.getElementById('toggleMicBtn');
    if (stateType === 'active') {
      btn.innerText = "🛑 Stop Listening";
      btn.style.background = "#ef4444";
      btn.style.color = "#ffffff";
      document.getElementById('statusDot').classList.add('active');
      document.getElementById('statusText').innerText = message;
      startMinimalVisualizer();
    }
  }

  function processTranscriptChunk(text) {
    const rawBox = document.getElementById('rawStream');
    if (rawBox.children[0]?.style?.color) rawBox.innerHTML = '';

    const p = document.createElement('p');
    p.className = 'raw-text';
    p.innerText = text;
    rawBox.appendChild(p);
    rawBox.scrollTop = rawBox.scrollHeight;

    const words = text.trim().split(/\s+/).filter(Boolean).length;
    wordTotal += words;
    document.getElementById('wordCount').innerText = wordTotal;

    parseIntentAndAddCard(text);
  }

  function parseIntentAndAddCard(text) {
    const lower = text.toLowerCase().trim();
    let type = 'NOTE';
    
    if (/^(hello|hi|hey|whatsapp|good morning|thanks|thank you|bye)$/i.test(lower)) {
      type = 'GREETING';
    } 
    else if (/\b(need to|have to|must|action item|task|todo|assign|remember to|deadline|finish|submit|build|fix|update|send|create)\b/i.test(lower)) {
      type = 'TASK';
    } 
    else if (/\b(what|why|how|when|where|who|which|can we|should we|could you|is it|do you)\b/i.test(lower) || lower.includes('?')) {
      type = 'QUERY';
    }

    const cardsBox = document.getElementById('cardsBox');
    const card = document.createElement('div');
    card.className = `card ${type}`;
    
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    card.innerHTML = `
      <div class="card-header">
        <span>[${type}]</span>
        <span>${time}</span>
      </div>
      <div class="card-body">${text}</div>
    `;

    cardsBox.appendChild(card);
    cardsBox.scrollTop = cardsBox.scrollHeight;

    actionTotal++;
    document.getElementById('actionCount').innerText = actionTotal;
  }

  function runPresetDemo() {
    stopAllActivity();
    clearAll();
    
    isRunningDemo = true;
    const demoBtn = document.getElementById('demoBtn');
    demoBtn.innerText = "⏹️ Stop Demo";
    demoBtn.style.background = "#ef4444";
    demoBtn.style.color = "#ffffff";

    document.getElementById('statusDot').classList.add('active');
    document.getElementById('statusText').innerText = "Demo Running (Interruptible)";
    startMinimalVisualizer();

    const demoScript = [
      "Hello everyone, welcome to the project presentation.",
      "What is the core architecture plan for our backend microservices?",
      "We need to finalize the database authorization rules by tonight.",
      "Please assign the UI deployment task to Sarah immediately.",
      "Note that all API endpoints must be fully secured before production release."
    ];

    let currentIndex = 0;

    function playNextStep() {
      // Check if user interrupted or stopped the demo
      if (!isRunningDemo || currentIndex >= demoScript.length) {
        if (currentIndex >= demoScript.length) stopAllActivity();
        return;
      }

      const currentText = demoScript[currentIndex];
      currentIndex++;

      processTranscriptChunk(currentText);

      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(currentText);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.lang = 'en-US';

        utterance.onend = () => {
          if (isRunningDemo) {
            demoTimer = setTimeout(playNextStep, 900);
          }
        };

        utterance.onerror = () => {
          if (isRunningDemo) {
            demoTimer = setTimeout(playNextStep, 1000);
          }
        };

        synth.speak(utterance);
      } else {
        demoTimer = setTimeout(playNextStep, 3500);
      }
    }

    playNextStep();
  }

  function startMinimalVisualizer() {
    if (animInterval) clearInterval(animInterval);
    animInterval = setInterval(() => {
      barElements.forEach((bar, idx) => {
        const height = Math.floor(Math.random() * 28 + 6);
        bar.style.height = `${height}px`;
        if (height > 18) {
          bar.classList.add('active');
        } else {
          bar.classList.remove('active');
        }
      });
    }, 110);
  }

  function stopMinimalVisualizer() {
    if (animInterval) clearInterval(animInterval);
    barElements.forEach(bar => {
      bar.style.height = '10px';
      bar.classList.remove('active');
    });
  }

  function clearAll() {
    interruptSpeechAndDemo();
    document.getElementById('rawStream').innerHTML = '<span class="raw-text" style="color: #4b5563;">Awaiting audio stream or demo execution...</span>';
    document.getElementById('cardsBox').innerHTML = '';
    wordTotal = 0;
    actionTotal = 0;
    document.getElementById('wordCount').innerText = '0';
    document.getElementById('actionCount').innerText = '0';
  }

  function exportReport() {
    const cards = document.querySelectorAll('.card');
    if (!cards.length) return alert("No compiler data available to export.");

    let output = `=======================================\n`;
    output += `AUDIO COMPILE AGENT - EXECUTIVE REPORT\n`;
    output += `Generated: ${new Date().toLocaleString()}\n`;
    output += `=======================================\n\n`;

    cards.forEach(c => {
      const header = c.querySelector('.card-header').innerText;
      const body = c.querySelector('.card-body').innerText;
      output += `${header}\n${body}\n---------------------------------------\n`;
    });

    const blob = new Blob([output], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Audio_Compile_Report_${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
